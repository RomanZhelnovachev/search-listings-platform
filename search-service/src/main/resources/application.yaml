spring:
  application:
    name: search-service

  datasource:
    url: jdbc:postgresql://postgres:5432/search_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml


  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: search-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ru.romzheln.search_service.dto.event
        spring.json.value.default.type: ru.romzheln.search_service.dto.event.EventMessage
        spring.json.use.type.headers: false
      enable-auto-commit: false
    topic:
      listing-events: listing-events