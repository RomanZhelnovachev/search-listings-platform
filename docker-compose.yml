services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listings_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-listings_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  search-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: search_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - search_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-mock:
    build:
      context: .
      dockerfile: auth-mock/Dockerfile
    ports:
      - "8081:8080"

  listing-service:
    image: eclipse-temurin:17-jre
    ports:
      - "8080:8080"
      - "9010:9010"
    volumes:
      - ./listing-service/target/listing-service-1.0.0-SNAPSHOT.jar:/app/app.jar
    env_file:
      - ./listing-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-mock:
        condition: service_started
    command: [ "java", "-jar", "/app/app.jar" ]

  search-service:
    image: eclipse-temurin:17-jre
    ports:
      - "8082:8080"
      - "9011:9010"
    volumes:
      - ./search-service/target/search-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    env_file:
      - ./search-service/.env
    depends_on:
      search-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: [ "java", "-jar", "/app/app.jar" ]

volumes:
  pgdata:
  search_pgdata:
  kafkadata: