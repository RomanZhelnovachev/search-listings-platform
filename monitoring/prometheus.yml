global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "listing-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["listing-service:8080"]

  - job_name: "search-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["search-service:8080"]